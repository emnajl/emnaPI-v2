<mat-toolbar class="topbar gap-10">
  <button mat-icon-button (click)="toggleMobileNav.emit()" class="d-flex d-md-none justify-content-center">
    <i-tabler name="menu-2" class="icon-20 d-flex"></i-tabler>
  </button>

  <div class="header-title d-flex align-items-center">
    <i-tabler name="building-community" class="icon-22 text-primary m-r-8"></i-tabler>
    <div>
      <div class="header-kicker">EMNA</div>
      <div class="header-label">Module Gestion Des Ressources</div>
    </div>
  </div>

  <span class="flex-1-auto"></span>

  <button class="rounded-pill" mat-mini-fab [matMenuTriggerFor]="profilemenu" aria-label="Profil">
    <img src="/assets/images/profile/user-1.jpg" class="rounded-circle object-cover d-block" width="35" />
  </button>

  <mat-menu #profilemenu="matMenu" class="cardWithShadow topbar-dd" xPosition="before">
    <button mat-menu-item disabled>
      <mat-icon class="d-flex align-items-center">
        <i-tabler name="shield-check" class="icon-18 d-flex"></i-tabler>
      </mat-icon>
      Administration EMNA
    </button>

    <div class="p-x-12 m-t-12">
      <a [routerLink]="['/authentication/login']" mat-stroked-button class="w-100">Déconnexion</a>
    </div>
  </mat-menu>
</mat-toolbar>
