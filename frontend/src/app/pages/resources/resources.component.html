<div class="glass-card">
  <h2>Salles Disponibles</h2>
  <div style="display: flex; gap: 1rem; flex-wrap: wrap; margin-top: 1rem;">
    <div class="glass-card" style="flex: 1; min-width: 250px;" *ngFor="let room of rooms">
      <h3>{{ room.name }}</h3>
      <p style="color: var(--text-muted); margin: 0.5rem 0;">Capacité: {{ room.capacity }} personnes</p>
      <p style="color: var(--text-muted); margin: 0.5rem 0;">Lieu: {{ room.location }}</p>
      <span class="badge badge-available" *ngIf="room.status === 'AVAILABLE'">Disponible</span>
      <span class="badge badge-maintenance" *ngIf="room.status === 'MAINTENANCE'">En maintenance</span>
      <span class="badge badge-unavailable" *ngIf="room.status === 'UNAVAILABLE'">Indisponible</span>
    </div>
  </div>
</div>

<div class="glass-card" style="margin-top: 2rem;">
  <h2>Équipements</h2>
  <div style="display: flex; gap: 1rem; flex-wrap: wrap; margin-top: 1rem;">
    <div class="glass-card" style="flex: 1; min-width: 250px;" *ngFor="let eq of equipments">
      <h3>{{ eq.name }}</h3>
      <p style="color: var(--text-muted); margin: 0.5rem 0;">Type: {{ eq.type }}</p>
      <p style="color: var(--text-muted); margin: 0.5rem 0;">Réf: {{ eq.reference }}</p>
      <span class="badge" style="background: rgba(239,68,68,0.2); color: var(--error); margin-bottom: 0.5rem; display: inline-block;" *ngIf="eq.sensitive">Sensible (Validation Admin)</span><br>
      <span class="badge badge-available" *ngIf="eq.status === 'AVAILABLE'">Disponible</span>
      <span class="badge badge-maintenance" *ngIf="eq.status === 'MAINTENANCE'">En maintenance</span>
      <span class="badge badge-unavailable" *ngIf="eq.status === 'UNAVAILABLE'">Indisponible</span>
    </div>
  </div>
</div>
